    <link rel="stylesheet" href="styles.css?v=7.4">
    <script>
        // Apply theme before first paint to prevent flash (same data-theme/localStorage convention as the main site)
        (function () {
            var t = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : null);
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png">
    <style>
        .not-found-container {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 2rem;
        }

        .not-found-content {
            text-align: center;
            max-width: 500px;
        }

        .not-found-title {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
        }

        .not-found-subtitle {
            font-size: 1.5rem;
            color: #f1f5f9;
            margin: 1rem 0;
            font-weight: 600;
        }

        .not-found-description {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .not-found-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Dark theme: fall back to the site's theme variables (defined in styles.css) */
        [data-theme="dark"] .not-found-container {
            background: var(--theme-bg);
        }

        [data-theme="dark"] .not-found-subtitle {
            color: var(--theme-text-primary);
        }

        [data-theme="dark"] .not-found-description {
            color: var(--theme-text-secondary);
        }
    </style>
</head>

<body>
    <div class="not-found-container">
        <div class="not-found-content">
            <h1 class="not-found-title">404</h1>
            <h2 class="not-found-subtitle">Page Not Found</h2>
            <p class="not-found-description">
                Oops! The page you're looking for doesn't exist or has been moved.
            </p>
            <div class="not-found-actions">
                <a href="index.html" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    Go Home
                </a>
                <button type="button" id="goBackBtn" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                    Go Back
                </button>
            </div>
        </div>
    </div>

    <script>
        // "Go Back" button (moved off the former inline onclick handler)
        document.getElementById('goBackBtn').addEventListener('click', function () {
            history.back();
        });
    </script>
</body>
