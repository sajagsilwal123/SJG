<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sajag Silwal — CV</title>
  <link rel="icon" href="favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .cv-toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cv-toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .cv-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #f5f5f5;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .cv-back-btn:hover, .cv-back-btn:active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .cv-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.85;
    }

    .cv-toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .cv-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      background: #f5f5f5;
      color: #0a0a0a;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .cv-download-btn:hover, .cv-download-btn:active {
      opacity: 0.85;
    }

    .cv-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-viewer-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #1a1a1a;
      -webkit-overflow-scrolling: touch;
    }

    .pdf-page-canvas {
      width: 100%;
      height: auto !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      background: white;
      border-radius: 4px;
    }

    /* Fallback for browsers that can't render PDFs in iframe */
    .cv-fallback {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 24px;
      text-align: center;
    }

    .cv-fallback-icon {
      opacity: 0.4;
    }

    .cv-fallback p {
      font-size: 1rem;
      opacity: 0.6;
      line-height: 1.6;
    }

    .cv-fallback .cv-open-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      background: #f5f5f5;
      color: #0a0a0a;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="cv-toolbar">
    <div class="cv-toolbar-left">
      <a href="index.html" class="cv-back-btn" id="cvBackBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
        <span>Back</span>
      </a>
      <span class="cv-title">Sajag Silwal — CV</span>
    </div>
    <div class="cv-toolbar-right">
      <a href="cv.pdf" download="Sajag_Silwal_CV.pdf" class="cv-download-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span>Download</span>
      </a>
    </div>
  </div>

  <div class="cv-body">
    <div id="pdfViewer" class="pdf-viewer-container">
      <div style="padding: 40px; text-align: center; opacity: 0.6; font-size: 0.95rem;">Loading CV...</div>
    </div>
    <div class="cv-fallback" id="cvFallback">
      <svg class="cv-fallback-icon" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
        <polyline points="14 2 14 8 20 8" />
      </svg>
      <p>Your browser can't display the PDF inline.<br>Tap below to open or download it.</p>
      <a href="cv.pdf" class="cv-open-btn">
        Open PDF
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
      </a>
    </div>
  </div>

  <script>
    // Specify the PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const container = document.getElementById('pdfViewer');
    const fallback = document.getElementById('cvFallback');

    // Load document
    const loadingTask = pdfjsLib.getDocument('cv.pdf');
    loadingTask.promise.then(pdf => {
      // Clear loading state indicator
      container.innerHTML = '';
      
      // Render each page
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(page => {
          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page-canvas';
          container.appendChild(canvas);
          
          const context = canvas.getContext('2d');
          
          // Determine the viewport scale based on screen width
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const containerWidth = container.clientWidth - 32; // padding offset
          const scale = containerWidth / unscaledViewport.width;
          
          // Render at high resolution based on screen width and pixel ratio
          const viewport = page.getViewport({ scale: Math.max(scale, 1.5) * window.devicePixelRatio });
          
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          
          // Scale canvas display size back to fit container width
          canvas.style.width = '100%';
          canvas.style.maxWidth = `${unscaledViewport.width}px`;
          
          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };
          
          page.render(renderContext);
        });
      }
    }).catch(err => {
      console.error('Error rendering PDF with PDF.js:', err);
      // Fallback to direct link UI
      container.style.display = 'none';
      fallback.style.display = 'flex';
    });
  </script>
</body>

</html>
